# Derry Script Manager - Shortcuts for Commands
# !!!FUSEKI_HOME und ANDROID_SDK müssen in den Umgebungsvariabeln gesetzt werden
# --- FUSEKI & ONTOLOGY KOMMANDOS ---
# Aufruf: derry ontology:convert -> Protoge Onotolgy Format > Fuseki Knowledge Graph Format
fuseki:convert: robot convert --input ../../knowledge_graph/ontology/PhysicalTherapy.owx --output ../../api/PhysicalTherapy.ttl --format ttl
# Aufruf: derry fuseki:run -> Fuseki Server starten
fuseki:run: \${FUSEKI_HOME}/fuseki-server --file=../../api/PhysicalTherapy.ttl /rehab
# Aufruf: derry fuseki:start -> Fuseki Server starten mit aktuellen Knowledge Graph
fuseki:start:
  - derry fuseki:convert
  - derry fuseki:run

# --- ANDROID EMULATOR KOMMANDOS ---
# Aufruf: derry emu:list -> Liste aller Emulator anzeigen für GeräteID anzeigen. Wird von Android Studio zugewiesen
emu:list: flutter emulators
# Aufruf: derry emu:launch -- <GeräteID> -> Emulator starten mit GeräteID
emu:run: flutter emulators --launch #-- <GeräteID>
# Aufruf: derry emu:launch:android -> Emulator starten mit default Android Gerät
emu:run:android: derry emu:run -- \${ANDROID_DEFAULT_DEVICEID}
# Aufruf: derry emu:log <Prefix_Path> <GeräteID> -> Emulator starten mit Terminal Log und GeräteID
emu:log: \${ANDROID_SDK}/emulator/emulator -verbose -gpu host -avd #-- <GeräteID>
emu:log:android: derry emu:log -- \${ANDROID_DEFAULT_DEVICEID}

# --- FLUTTER APP STARTEN ---
# Aufruf: derry devices:list -> Verfügbare Flutter Devices anzeigen. Wird von Flutter zugewiesen
devices:list: flutter devices
# Aufruf: derry app:chrome -> Flutter App in Chrome starten
app:chrome: flutter run -d chrome
# Aufruf: derry app:android -> Flutter App auf einem Android Emulator starten
app:phone: flutter run -d #-- <DevicesID> z.B. emulator-5554
# Aufruf: derry app:android -> Flutter App auf default Android Emulator starten. Suche verfügbare Android DeviceID und nimmt diese.
app:phone:android: derry app:phone -- \$(adb devices | grep emulator | head -n 1 | cut -f1)

# --- ISAR LOCALSTORAGE BUILD  ---
# Aufruf: derry build:storage -> Baut aus den Isar Annotations für die Models die Storage Objekte.
storage:build: dart run build_runner build
# Aufruf: derry storage:watch -> Baut aus den Isar Annotations für die Models die Storage Objekte. Baut bei Code Änderungen neu.
storage:watch: dart run build_runner watch

