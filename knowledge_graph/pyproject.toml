[project]
name = "reha-knowledge-graph"
version = "0.1.0"
description = "Erstellung und Fütterung des Reha-Knowledge-Graphs"
readme = "README.md"
requires-python = ">=3.10"

# Abhängigkeiten
dependencies = [
    "rdflib>=7.0.0",         # für RDF-Triples
    "pandas>=2.2.0",         # Einlesen von CSV/Excel
    "requests>=2.31.0",      # Senden an Fuseki Server   # SPARQL in python
    "sparqlwrapper>=2.0.0",
]
