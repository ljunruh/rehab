name: reha_app
description: "Reha App — UI/UX (Bachelorprojekt). Flutter-Umsetzung der Oberfläche."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management (StyleGuide-konformer, einfacher Ansatz)
  provider: ^6.1.2

  # SVG-Icons aus assets/icons/* (Navbar, Tipp, Profil)
  flutter_svg: ^2.0.10+1

  # Inter-Schrift bequem laden, falls kein lokales Font-Asset gewünscht ist.
  # Alternativ die Inter-Schriftdateien lokal einbinden (siehe fonts: unten,
  # auskommentiert) und google_fonts entfernen.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/navbar/
    - assets/icons/tip/
    - assets/icons/profile/

  # ── Inter lokal einbinden (optional) ──────────────────────────
  # Wenn ihr die Inter-Schrift als Asset mitliefern wollt (offline-fähig,
  # kein google_fonts nötig), legt die .ttf-Dateien unter assets/fonts/ ab
  # und aktiviert diesen Block. Dann muss in den TextStyles fontFamily:
  # 'Inter' (wie bereits gesetzt) verwendet werden.
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
